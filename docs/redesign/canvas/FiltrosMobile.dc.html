<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Nunito:wght@400;600;700&display=swap">
  <style>
    body { margin: 0; font-family: 'Nunito', 'Segoe UI', system-ui, sans-serif; background: #fcfafa; color: #2f2f35; -webkit-font-smoothing: antialiased; }
    * { box-sizing: border-box; }
    a { color: #650010; text-decoration: none; }
    a:hover { color: #820018; }
    h1, h2, h3 { font-family: 'Poppins', 'Century Gothic', system-ui, sans-serif; margin: 0; }
    p { margin: 0; }
  </style>
</helmet>

<div style="position: relative; width: 390px; height: 844px; overflow: hidden; background: #fcfafa; font-family: 'Nunito', 'Segoe UI', system-ui, sans-serif;">

  <!-- Listagem ao fundo (esmaecida) -->
  <div style="display: flex; flex-direction: column; gap: 14px; padding: 16px;">
    <div style="display: flex; align-items: center; gap: 12px;">
      <img src="logo-era1x.png" alt="Era1x Ler Artes" style="width: 44px; height: 44px; object-fit: contain;">
      <div style="display: flex; align-items: center; flex-grow: 1; height: 44px; padding: 0 14px; border-radius: 9999px; border: 1px solid #ececec; background: #f3f3f4; font-size: 14px; color: #666666;">Buscar no catálogo</div>
    </div>
    <h1 style="font-size: 26px; font-weight: 700; letter-spacing: -0.02em; color: #2f2f35;">Catálogo de produtos</h1>
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px;">
      <div style="height: 150px; border-radius: 16px; background: #f7edee;"></div>
      <div style="height: 150px; border-radius: 16px; background: #fdf1f4;"></div>
    </div>
  </div>

  <!-- Scrim -->
  <div style="position: absolute; inset: 0; background: rgba(47, 47, 53, 0.5);"></div>

  <!-- Bottom sheet -->
  <div style="position: absolute; left: 0; right: 0; bottom: 0; display: flex; flex-direction: column; height: 780px; border-radius: 28px 28px 0 0; background: #ffffff; box-shadow: 0 8px 24px rgb(101 0 16 / 0.08), 0 20px 48px rgb(101 0 16 / 0.10);">

    <!-- Puxador + cabeçalho -->
    <div style="display: flex; flex-direction: column; gap: 12px; padding: 10px 20px 14px 20px; border-bottom: 1px solid #ececec;">
      <span style="width: 44px; height: 5px; border-radius: 9999px; background: #ececec; align-self: center;"></span>
      <div style="display: flex; align-items: center; justify-content: space-between;">
        <h2 style="font-size: 20px; font-weight: 700; color: #2f2f35;">Filtros</h2>
        <span style="display: inline-flex; align-items: center; justify-content: center; width: 44px; height: 44px; border-radius: 9999px; background: #f3f3f4;">
          <svg viewBox="0 0 20 20" fill="none" stroke="#2f2f35" stroke-width="1.8" style="width: 17px; height: 17px;"><path d="M5 5l10 10M15 5L5 15" stroke-linecap="round"></path></svg>
        </span>
      </div>
    </div>

    <!-- Corpo -->
    <div style="display: flex; flex-direction: column; gap: 20px; flex-grow: 1; padding: 18px 20px; overflow: hidden;">

      <div style="display: flex; flex-direction: column; gap: 10px;">
        <span style="font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; color: #666666;">Categoria</span>
        <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px;">
          <span style="display: inline-flex; align-items: center; justify-content: space-between; gap: 6px; height: 46px; padding: 0 14px; border-radius: 12px; font-size: 14px; font-weight: 700; color: #ffffff; background: #650010;">
            Tintas e Pigmentos
            <span style="font-size: 12px; font-weight: 700; color: #f7b8c6;">34</span>
          </span>
          <span style="display: inline-flex; align-items: center; justify-content: space-between; gap: 6px; height: 46px; padding: 0 14px; border-radius: 12px; font-size: 14px; font-weight: 600; color: #2f2f35; border: 1px solid #ececec; background: #f3f3f4;">
            Pincéis
            <span style="font-size: 12px; color: #666666;">21</span>
          </span>
          <span style="display: inline-flex; align-items: center; justify-content: space-between; gap: 6px; height: 46px; padding: 0 14px; border-radius: 12px; font-size: 14px; font-weight: 600; color: #2f2f35; border: 1px solid #ececec; background: #f3f3f4;">
            Suportes
            <span style="font-size: 12px; color: #666666;">18</span>
          </span>
          <span style="display: inline-flex; align-items: center; justify-content: space-between; gap: 6px; height: 46px; padding: 0 14px; border-radius: 12px; font-size: 14px; font-weight: 600; color: #2f2f35; border: 1px solid #ececec; background: #f3f3f4;">
            Linhas e Fios
            <span style="font-size: 12px; color: #666666;">27</span>
          </span>
        </div>
      </div>

      <div style="display: flex; flex-direction: column; gap: 10px;">
        <span style="font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; color: #666666;">Marca</span>
        <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px;">
          <span style="display: inline-flex; align-items: center; justify-content: space-between; gap: 6px; height: 46px; padding: 0 14px; border-radius: 12px; font-size: 14px; font-weight: 700; color: #ffffff; background: #650010;">
            ArteBranca
            <span style="font-size: 12px; font-weight: 700; color: #f7b8c6;">42</span>
          </span>
          <span style="display: inline-flex; align-items: center; justify-content: space-between; gap: 6px; height: 46px; padding: 0 14px; border-radius: 12px; font-size: 14px; font-weight: 600; color: #2f2f35; border: 1px solid #ececec; background: #f3f3f4;">
            Fio &amp; Arte
            <span style="font-size: 12px; color: #666666;">36</span>
          </span>
          <span style="display: inline-flex; align-items: center; justify-content: space-between; gap: 6px; height: 46px; padding: 0 14px; border-radius: 12px; font-size: 14px; font-weight: 600; color: #2f2f35; border: 1px solid #ececec; background: #f3f3f4;">
            Paperviva
            <span style="font-size: 12px; color: #666666;">29</span>
          </span>
          <span style="display: inline-flex; align-items: center; justify-content: space-between; gap: 6px; height: 46px; padding: 0 14px; border-radius: 12px; font-size: 14px; font-weight: 600; color: #2f2f35; border: 1px solid #ececec; background: #f3f3f4;">
            TerraCriativa
            <span style="font-size: 12px; color: #666666;">31</span>
          </span>
        </div>
      </div>

      <div style="display: flex; flex-direction: column; gap: 12px;">
        <span style="font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; color: #666666;">Faixa de preço</span>
        <div style="position: relative; height: 6px; border-radius: 9999px; background: #ececec;">
          <div style="position: absolute; left: 12%; right: 34%; top: 0; height: 6px; border-radius: 9999px; background: #650010;"></div>
          <div style="position: absolute; left: 12%; top: -9px; width: 24px; height: 24px; margin-left: -12px; border-radius: 9999px; background: #ffffff; border: 3px solid #650010; box-shadow: 0 1px 2px rgb(101 0 16 / 0.04), 0 4px 14px rgb(101 0 16 / 0.05);"></div>
          <div style="position: absolute; left: 66%; top: -9px; width: 24px; height: 24px; margin-left: -12px; border-radius: 9999px; background: #ffffff; border: 3px solid #650010; box-shadow: 0 1px 2px rgb(101 0 16 / 0.04), 0 4px 14px rgb(101 0 16 / 0.05);"></div>
        </div>
        <div style="display: flex; align-items: center; gap: 12px;">
          <div style="display: flex; align-items: center; flex-grow: 1; height: 48px; padding: 0 14px; border-radius: 12px; border: 1px solid #ececec; background: #f3f3f4; font-size: 15px; color: #2f2f35;">R$ 15,00</div>
          <span style="color: #666666;">–</span>
          <div style="display: flex; align-items: center; flex-grow: 1; height: 48px; padding: 0 14px; border-radius: 12px; border: 1px solid #ececec; background: #f3f3f4; font-size: 15px; color: #2f2f35;">R$ 90,00</div>
        </div>
      </div>

      <div style="display: flex; flex-direction: column; gap: 10px;">
        <span style="font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; color: #666666;">Disponibilidade</span>
        <div style="display: flex; align-items: center; justify-content: space-between; height: 52px; padding: 0 16px; border-radius: 12px; border: 1px solid #ececec; background: #ffffff;">
          <span style="font-size: 15px; color: #2f2f35;">Pronta entrega</span>
          <span style="position: relative; width: 46px; height: 26px; border-radius: 9999px; background: #ececec;">
            <span style="position: absolute; left: 3px; top: 3px; width: 20px; height: 20px; border-radius: 9999px; background: #ffffff;"></span>
          </span>
        </div>
        <div style="display: flex; align-items: center; justify-content: space-between; height: 52px; padding: 0 16px; border-radius: 12px; background: #fdf1f4;">
          <span style="font-size: 15px; font-weight: 700; color: #650010;">Apenas destaques</span>
          <span style="position: relative; width: 46px; height: 26px; border-radius: 9999px; background: #650010;">
            <span style="position: absolute; right: 3px; top: 3px; width: 20px; height: 20px; border-radius: 9999px; background: #ffffff;"></span>
          </span>
        </div>
      </div>
    </div>

    <!-- Ação fixa -->
    <div style="display: flex; align-items: center; gap: 12px; padding: 16px 20px 26px 20px; border-top: 1px solid #ececec; background: #ffffff;">
      <span style="display: inline-flex; align-items: center; justify-content: center; height: 52px; padding: 0 20px; border-radius: 14px; font-size: 15px; font-weight: 700; color: #2f2f35; border: 1px solid #ececec; background: #ffffff;">Limpar</span>
      <span style="display: inline-flex; align-items: center; justify-content: center; flex-grow: 1; height: 52px; border-radius: 14px; font-size: 16px; font-weight: 700; color: #ffffff; background: #650010;">Ver 18 produtos</span>
    </div>
  </div>
</div>
</x-dc>
</body>
</html>
