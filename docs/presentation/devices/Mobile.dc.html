<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&family=Nunito:wght@400;600;700&display=swap">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: 'Nunito', 'Segoe UI', system-ui, sans-serif; }
    a { color: #650010; text-decoration: none; } a:hover { color: #820018; }
    .dsp { font-family: 'Poppins', 'Century Gothic', system-ui, sans-serif; }

    .slide { position: relative; overflow: hidden; width: 1920px; height: 1080px;
             display: flex; flex-direction: column; }
    .stage { flex: 1; display: flex; align-items: flex-end; justify-content: center; gap: 80px;
             padding: 0 100px 100px; }

    /* --- notebook --- */
    .mac { display: flex; flex-direction: column; align-items: center; flex-shrink: 0; }
    .mac-lid { width: 1148px; padding: 13px 14px 16px; border-radius: 15px;
               background: linear-gradient(160deg, #3a3a3d 0%, #212124 40%, #171719 100%);
               box-shadow: 0 2px 0 rgba(255,255,255,0.10) inset,
                           0 40px 80px rgba(23,10,13,0.28), 0 12px 28px rgba(23,10,13,0.18); }
    .mac-cam { width: 6px; height: 6px; margin: -8px auto 2px; border-radius: 9999px;
               background: #4a4a4e; }
    .mac-screen { width: 1120px; height: 700px; overflow: hidden; border-radius: 5px;
                  background: #fcfafa; }
    .mac-screen img { display: block; width: 1120px; height: 700px; object-fit: cover;
                      object-position: top center; }
    .mac-base { width: 1204px; height: 13px; border-radius: 0 0 9px 9px;
                background: linear-gradient(180deg, #d3d4d7 0%, #b4b5b9 42%, #8d8e93 78%, #6e6f74 100%);
                clip-path: polygon(0 0, 100% 0, 99.1% 100%, 0.9% 100%); position: relative; }
    .mac-groove { position: absolute; left: 50%; top: 0; width: 118px; height: 6px;
                  transform: translateX(-50%); border-radius: 0 0 7px 7px;
                  background: linear-gradient(180deg, rgba(90,91,96,0.55), rgba(150,151,156,0.15)); }

    /* --- telefone --- */
    .iph { position: relative; flex-shrink: 0; padding: 11px; border-radius: 44px;
           background: linear-gradient(155deg, #46464a 0%, #232326 38%, #141416 100%);
           box-shadow: 0 2px 0 rgba(255,255,255,0.12) inset,
                       0 30px 60px rgba(23,10,13,0.26), 0 10px 22px rgba(23,10,13,0.16); }
    .iph-screen { overflow: hidden; border-radius: 34px; background: #fcfafa; }
    .iph-screen img { display: block; object-fit: cover; object-position: top center; }
    .iph-cam { position: absolute; left: 50%; top: 4px; width: 5px; height: 5px;
               transform: translateX(-50%); border-radius: 9999px; background: #4a4a4e; }
    .iph-btn { position: absolute; right: -3px; width: 3px; border-radius: 0 3px 3px 0;
               background: linear-gradient(180deg, #3a3a3d, #232326); }
    .iph-vol { position: absolute; left: -3px; width: 3px; border-radius: 3px 0 0 3px;
               background: linear-gradient(180deg, #3a3a3d, #232326); }

    .label { padding: 92px 100px 0; }
    .kicker { margin: 0; font-size: 15px; font-weight: 700; text-transform: uppercase;
              letter-spacing: 0.14em; }
    .htitle { margin: 10px 0 0; font-size: 46px; font-weight: 700; letter-spacing: -0.02em;
              line-height: 1.1; }
    .hsub { margin: 12px 0 0; max-width: 900px; font-size: 20px; line-height: 1.55; }
</style>
</helmet>

<div class="slide" style="background: #650010;">
  
    <svg viewBox="0 0 600 600" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true"
         style="position: absolute; right: -180px; bottom: -260px; width: 900px; height: 900px; color: rgba(247,184,198,0.14);">
      <circle cx="300" cy="300" r="260" /><circle cx="300" cy="300" r="190" /><circle cx="300" cy="300" r="120" />
      <path d="M40 300h520M300 40v520" stroke-linecap="round" />
    </svg>
  <div class="label" style="position: relative;">
    <p class="kicker" style="color: #f7b8c6;">No celular</p>
    <h2 class="dsp htitle" style="color: #ffffff;">Pensado primeiro para a tela pequena</h2>
    <p class="hsub" style="color: #f7b8c6;">Alvos de toque de 44px, filtros em folha inferior e a consulta sempre ao alcance do polegar.</p>
  </div>
  <div class="stage" style="position: relative; gap: 96px; padding-bottom: 84px;">
    <div style="display: flex; flex-direction: column; align-items: center; gap: 22px;">
      
      <div class="iph" style="border-radius: 52px;">
        <div class="iph-cam"></div>
        <div class="iph-btn" style="top: 167px; height: 71px;"></div>
        <div class="iph-vol" style="top: 109px; height: 32px;"></div>
        <div class="iph-vol" style="top: 154px; height: 45px;"></div>
        <div class="iph-screen" style="width: 296px; height: 641px; border-radius: 40px;">
          <img src="scr-home-iphone.jpg" alt="Home no celular" style="width: 296px; height: 641px;" />
        </div>
      </div>
      <span style="font-size: 17px; font-weight: 700; color: #f7b8c6;">Home</span>
    </div>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 22px;">
      
      <div class="iph" style="border-radius: 52px;">
        <div class="iph-cam"></div>
        <div class="iph-btn" style="top: 167px; height: 71px;"></div>
        <div class="iph-vol" style="top: 109px; height: 32px;"></div>
        <div class="iph-vol" style="top: 154px; height: 45px;"></div>
        <div class="iph-screen" style="width: 296px; height: 641px; border-radius: 40px;">
          <img src="scr-catalogo-iphone.jpg" alt="Catálogo no celular" style="width: 296px; height: 641px;" />
        </div>
      </div>
      <span style="font-size: 17px; font-weight: 700; color: #f7b8c6;">Catálogo</span>
    </div>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 22px;">
      
      <div class="iph" style="border-radius: 52px;">
        <div class="iph-cam"></div>
        <div class="iph-btn" style="top: 167px; height: 71px;"></div>
        <div class="iph-vol" style="top: 109px; height: 32px;"></div>
        <div class="iph-vol" style="top: 154px; height: 45px;"></div>
        <div class="iph-screen" style="width: 296px; height: 641px; border-radius: 40px;">
          <img src="scr-blog-iphone.jpg" alt="Blog no celular" style="width: 296px; height: 641px;" />
        </div>
      </div>
      <span style="font-size: 17px; font-weight: 700; color: #f7b8c6;">Blog</span>
    </div>
  </div>
</div>
</x-dc>
</body>
</html>
