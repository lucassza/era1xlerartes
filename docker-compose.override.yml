# Produção no host: bind em 127.0.0.1 + workers
services:
  nginx:
    ports: !override
      - "127.0.0.1:8091:80"

  minio:
    ports: !override
      - "127.0.0.1:9010:9000"
      - "127.0.0.1:9011:9001"

  mailpit:
    ports: !override
      - "127.0.0.1:1125:1025"
      - "127.0.0.1:8125:8025"

  queue:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      args:
        PHP_VERSION: ${PHP_VERSION:-8.5}
    container_name: era1x-ler-artes-queue
    restart: unless-stopped
    init: true
    working_dir: /var/www/html
    command: php artisan queue:work redis --sleep=3 --tries=3 --max-time=3600
    env_file:
      - .env
    volumes:
      - ./:/var/www/html
    depends_on:
      app:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - backend

  scheduler:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      args:
        PHP_VERSION: ${PHP_VERSION:-8.5}
    container_name: era1x-ler-artes-scheduler
    restart: unless-stopped
    init: true
    working_dir: /var/www/html
    command: php artisan schedule:work
    env_file:
      - .env
    volumes:
      - ./:/var/www/html
    depends_on:
      app:
        condition: service_healthy
    networks:
      - backend
